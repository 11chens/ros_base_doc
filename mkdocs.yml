site_name: ROS Base Documentation
site_description: Standardized ROS2 Framework for Complex Robot Systems
site_author: 11chens
repo_url: https://github.com/11chens/ros_base
edit_uri: edit/master/docs/
site_url: https://11chens.github.io/ros_base_doc/

theme:
  name: material
  language: zh
  features:
    - navigation.expand
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: zh
          default: true
          name: 中文
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            首页: Home
            快速上手: Quick Start
            环境配置: Installation
            核心架构: Architecture
            核心概念: Core Concepts
            "base_manager (系统管家)": "base_manager (System Manager)"
            "base_node (双模态节点)": "base_node (Dual-Mode Node)"
            "base_agent (算力与算法)": "base_agent (Computation and Algorithms)"
            "base_handler (状态机与调度)": "base_handler (State Machines and Scheduling)"
            参考应用工程: Examples
            "具身智能 (SigLoMa-VLM)": "Embodied Intelligence (SigLoMa-VLM)"
            "运动控制 (Quad-Deploy)": "Locomotion Control (Quad-Deploy)"
            可复用模块: Reusable Modules
            启动编排系统: Launch Orchestration System
            相机系统: Camera System
            "工具箱 (Utils)": "Utilities (Utils)"


markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - 首页: index.md
  - 快速上手:
    - 环境配置: quick-start/installation.md
    - 核心架构: quick-start/architecture.md
  - 核心概念:
    - base_manager (系统管家): core-concepts/manager.md
    - base_node (双模态节点): core-concepts/node.md
    - base_agent (算力与算法): core-concepts/agent.md
    - base_handler (状态机与调度): core-concepts/handler.md
  - 参考应用工程:
    - 具身智能 (SigLoMa-VLM): examples/sigloma-vlm.md
    - 运动控制 (Quad-Deploy): examples/quad-deploy.md
  - 可复用模块:
    - 启动编排系统: modules/launcher.md
    - 相机系统: modules/camera-system.md
    - 工具箱 (Utils): modules/utils.md
